# Автодеплой на хостинг reg.ru.
# Срабатывает при push в main. Заливает содержимое репозитория по FTP
# в каталог сайта, кроме служебных папок.
#
# Перед первым запуском добавить в GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#     FTP_SERVER    — адрес FTP (например server68.hosting.reg.ru)
#     FTP_USERNAME  — логин FTP-пользователя
#     FTP_PASSWORD  — его пароль
#     FTP_DIR       — каталог сайта, например /www/odrodok.ru/

name: Деплой на reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:      # позволяет запустить руками из вкладки Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Залить по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          # reg.ru отдаёт FTP только поверх TLS: с protocol: ftp сервер
          # отвечает 530 Login incorrect даже при верном пароле
          protocol: ftps
          port: 21
          security: loose
          # что не выкладывать на сайт
          exclude: |
            **/.git*
            **/.git*/**
            **/src/**
            **/tools/**
            **/dist/**
            **/README.md
            **/.DS_Store
